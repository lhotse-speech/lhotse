name: flake8

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check syntax and undefined names
        run: uv run --locked --only-group lint flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Report style warnings
        run: uv run --locked --only-group lint flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
