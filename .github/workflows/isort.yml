name: isort

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  isort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check import order
        run: uv run --locked --only-group lint isort --check --diff lhotse test setup.py _lhotse_version.py
