# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: unit_tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  unit_tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"  # note: no torchaudio, no torchcodec
            torch-install-cmd: "pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu"
            extra_deps: "multi-storage-client==0.16.0"
          - python-version: "3.12"  # note: no torchaudio, no torchcodec
            torch-install-cmd: "pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu"
            extra_deps: "multi-storage-client==0.16.0"
          - python-version: "3.13"  # note: no torchaudio
            torch-install-cmd: "pip install torch==2.12.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu"
            extra_deps: "multi-storage-client==0.16.0"
          - python-version: "3.14"  # note: no torchaudio
            torch-install-cmd: "pip install torch==2.14.1 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu"
            extra_deps: "multi-storage-client==0.16.0"
          - python-version: "3.15"  # note: no torchaudio
            torch-install-cmd: "pip install torch==2.15.0 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu"
            # Dill 0.4.1 uses co_lnotab, removed in Python 3.15. Pin the upstream
            # fix until it is released: https://github.com/uqfoundation/dill/pull/755
            extra_deps: "multi-storage-client==0.16.0 dill@git+https://github.com/uqfoundation/dill.git@37d2bf717ac7ac110f06be5210f989847959c2cd"

      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          docs/requirements.txt
          setup.py
    - name: Install apt dependencies
      run: |
        sudo apt update
        # CMake and HDF5 headers support source builds on the newest Python.
        sudo apt install libsndfile1-dev libsndfile1 ffmpeg sox cmake libhdf5-dev
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel numpy
        # Force the installation of a CPU-only PyTorch
        ${{ matrix.torch-install-cmd }}
        # the torchaudio env var does nothing when torchaudio is installed, but doesn't require it's presence when it's not
        pip install lilcom '.[tests]'
        # Enable some optional tests
        pip install h5py dill smart_open[http] webdataset==0.2.5 scipy nara_wpe pyloudnorm pillow aistore>=1.17.0 ${{ matrix.extra_deps }}
        # 1.23 adds wheels for Python 3.14 and 3.15.
        pip install "kaldi_native_io>=1.23.0"
    - name: Install sph2pipe
      run: |
        lhotse install-sph2pipe  # Handle sphere files.
    - name: Test with pytest and coverage
      run: |
        export TORCHAUDIO_USE_BACKEND_DISPATCHER=1
        pytest --cov --forked -n auto test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
