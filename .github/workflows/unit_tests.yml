name: unit_tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1-dev ffmpeg sox cmake libhdf5-dev
      - name: Install locked Python dependencies
        run: uv sync --locked --no-default-groups --extra tests --group ci
      - name: Install sph2pipe
        run: uv run --no-sync lhotse install-sph2pipe
      - name: Test with pytest and coverage
        run: uv run --no-sync pytest --cov --forked -n auto test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        continue-on-error: true
