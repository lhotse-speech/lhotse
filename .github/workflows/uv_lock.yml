name: uv_lock

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
      - uv.lock
      - .python-version
      - setup.py
      - _lhotse_version.py
      - VERSION
      - .github/workflows/uv_lock.yml
  pull_request:
    branches: [master]
    paths:
      - pyproject.toml
      - uv.lock
      - .python-version
      - setup.py
      - _lhotse_version.py
      - VERSION
      - .github/workflows/uv_lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uv_lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate the universal lockfile
        id: lock
        run: uv lock --check
      - name: Prepare a refreshed lockfile and patch
        id: refresh
        if: failure() && steps.lock.outcome == 'failure'
        run: |
          uv lock
          git add --intent-to-add uv.lock
          git diff --binary -- uv.lock > uv-lock.patch
      - name: Upload the suggested lockfile update
        if: failure() && steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: uv-lock-update
          path: |
            uv.lock
            uv-lock.patch
