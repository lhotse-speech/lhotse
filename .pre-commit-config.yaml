repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: uv run --locked --only-group lint flake8 --select=E9,F63,F7,F82
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: uv run --locked --only-group lint isort --profile=black
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --locked --only-group lint black
        language: system
        types: [python]
