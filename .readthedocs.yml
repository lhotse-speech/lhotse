version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.15"
  apt_packages:
    - libsndfile1-dev
  jobs:
    install:
      - python -m pip install uv==0.13.7
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --extra docs
sphinx:
  configuration: docs/conf.py
